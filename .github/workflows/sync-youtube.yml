name: Sync Rise and Reasons videos

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-youtube-videos.mjs
      - name: Commit fresh video feed
        run: |
          if git diff --quiet -- data/youtube-videos.json; then
            echo "No new videos"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-videos.json
          git commit -m "Refresh Rise and Reasons videos"
          git push
