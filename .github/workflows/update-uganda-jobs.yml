name: Update verified Uganda jobs
on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
concurrency:
  group: update-uganda-jobs
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Test Uganda job levels and collectors
        run: node --test scripts/*.test.mjs
      - name: Fetch, verify and normalize Uganda jobs
        id: jobs
        run: node scripts/sync-uganda-jobs.mjs
        env:
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME }}
      - name: Publish changed feeds
        run: |
          if [ -z "$(git status --porcelain -- data/uganda-jobs.json data/uganda-jobs-review.json data/uganda-job-sources.json data/jobs/uganda data/job-pages-uganda.json jobs/uganda)" ]; then
            echo "The Uganda jobs feed has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/uganda-jobs.json data/uganda-jobs-review.json data/uganda-job-sources.json data/jobs/uganda data/job-pages-uganda.json jobs/uganda
          git commit -m "Refresh verified Uganda jobs"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report held Uganda vacancies
        run: node scripts/uganda-review-alert.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Summarize run
        run: |
          echo "### Uganda jobs update" >> "$GITHUB_STEP_SUMMARY"
          echo "Published jobs: ${{ steps.jobs.outputs.job_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Held for review: ${{ steps.jobs.outputs.review_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Official sources only; duplicates, expiry and common scam language checked." >> "$GITHUB_STEP_SUMMARY"
      - name: Close recovered feed failure alerts
        if: success()
        run: |
          gh issue list --label uganda-jobs-feed --state open --json number --jq '.[].number' | while read -r issue; do
            gh issue close "$issue" --comment "The Uganda jobs update completed successfully. Closing this feed failure alert automatically."
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Report update failures
        if: ${{ failure() && !cancelled() }}
        run: |
          gh label create uganda-jobs-feed --color D93F0B --description "Automated Uganda jobs feed" 2>/dev/null || true
          existing=$(gh issue list --label uganda-jobs-feed --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "Uganda jobs feed update failed" --label uganda-jobs-feed --body "The scheduled Uganda jobs workflow failed. The existing public feed was left untouched."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
