name: Check scholarship deadlines

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: # allows running it by hand from the Actions tab

permissions:
  contents: write
  issues: write
  pages: write

concurrency: check-deadlines

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check official pages
        id: check
        run: node scripts/check-deadlines.mjs --report "$RUNNER_TEMP/report.md"

      - name: Publish updated data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.check.outputs.updated }}" = "true" ]; then
            message="Update scholarship deadlines from official pages"
          else
            message="Confirm scholarship deadlines against official pages"
          fi
          git add data/scholarships.js
          git commit -m "$message"
          git push
          # Pushes made by this workflow don't always trigger a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report anything that needs attention
        if: steps.check.outputs.attention == 'true'
        run: |
          gh label create deadline-check --color FBCA04 --description "Automated scholarship deadline check" 2>/dev/null || true
          issue=$(gh issue list --label deadline-check --state open --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            gh issue create --title "Scholarship deadlines need attention" --label deadline-check --body-file "$RUNNER_TEMP/report.md"
            exit 0
          fi
          # Only comment when the report differs from the last one, so a known issue doesn't repeat daily.
          last=$(gh issue view "$issue" --json body,comments --jq 'if (.comments | length) > 0 then .comments[-1].body else .body end')
          if [ "$last" != "$(cat "$RUNNER_TEMP/report.md")" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/report.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
